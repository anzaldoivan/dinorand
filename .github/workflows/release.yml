name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing annotated release tag to validate and publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - name: Check out the pushed tag with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the pinned release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Fetch the checked main branch
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Validate existing tag, version, ancestry, and curated notes
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_validate.py
          --tag "$RELEASE_TAG" --notes-output NOTES.md --github-output "$GITHUB_OUTPUT"
      - name: Preserve validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: NOTES.md
          if-no-files-found: error

  build:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DINORAND_DISABLE_REAL_INSTALL: "1"
    permissions:
      contents: read
    steps:
      - name: Check out the validated tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the pinned release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Use the pinned release SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423
      - name: Locked solution restore
        run: dotnet restore DinoRand.sln --locked-mode
      - name: Release build
        run: dotnet build DinoRand.sln -c Release --no-restore
      - name: Full test suite
        run: dotnet test DinoRand.sln -c Release --no-build --no-restore
      - name: Build and verify all release assets
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: bash scripts/build-release-assets.sh "$VERSION"
      - name: Upload the complete release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release-assets/*
          if-no-files-found: error

  attest:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Attest the complete asset set
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-assets/*

  publish:
    needs: [validate, build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the immutable release control commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Use the pinned release Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Download validated notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-metadata
          path: release-metadata
      - name: Create or resume, verify, and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/release_publish.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --version "$VERSION"
          --expected-commit "$EXPECTED_COMMIT"
          --prerelease "$PRERELEASE"
          --assets-dir release-assets
          --notes-file release-metadata/NOTES.md
          --attempts 3
          --request-timeout 120
          --upload-timeout 120
          --retry-delay 2
